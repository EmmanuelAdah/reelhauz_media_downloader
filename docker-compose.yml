x-app: &app
  build: .
  env_file: .env
  environment: &app-env
    DJANGO_DEBUG: "False"
    DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
    DATABASE_URL: postgres://video_user:video_pass@db:5432/video_downloader
    DOWNLOAD_BACKEND: celery   # production style: a dedicated worker container does the downloading
    REDIS_URL: redis://redis:6379/0
    DOWNLOAD_TMP_DIR: /app/tmp_downloads
  volumes:
    - tmp_data:/app/tmp_downloads
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_NAME} -d ${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    <<: *app
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --worker-class gthread --workers 2 --threads 16 --timeout 120"
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: celery -A config worker --loglevel=info --concurrency=2
    depends_on:
      - web

volumes:
  pg_data:
  tmp_data:
