services:
  warp:
    networks:
      - yt_dlp_egress
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS --max-time 8 --proxy socks5h://127.0.0.1:1080 https://www.cloudflare.com/cdn-cgi/trace | grep -Eq '^warp=(on|plus)$'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  web:
    environment:
      YTDLP_PROXY: ${YTDLP_PROXY-socks5h://warp:1080}
    networks:
      - default
      - yt_dlp_egress
    depends_on:
      warp:
        condition: service_healthy

  worker:
    environment:
      YTDLP_PROXY: ${YTDLP_PROXY-socks5h://warp:1080}
    networks:
      - default
      - yt_dlp_egress
    depends_on:
      warp:
        condition: service_healthy

networks:
  yt_dlp_egress:
