
# ------------------------------------------------------- #
# Docker embedded DNS resolver
# ------------------------------------------------------- #

resolver 127.0.0.11 valid=10s ipv6=off;


# ------------------------------------------------------- #
# WebSocket connection handling
# ------------------------------------------------------- #

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}


# ------------------------------------------------------- #
# Django upstream load balancing
# ------------------------------------------------------- #

upstream django_backend {

    zone django_backend 64k;

    # Docker dynamically discovers all running web replicas.
    server web:8000 resolve;

    # Send new connections to the least busy replica.
    least_conn;

    keepalive 32;
}


# ------------------------------------------------------- #
# HTTP server
# ------------------------------------------------------- #

server {

    listen 80;

    server_name _;

    client_max_body_size 100M;

    # --------------------------------------------------- #
    # Application requests
    # --------------------------------------------------- #

    location / {

        proxy_pass http://django_backend;

        proxy_http_version 1.1;

        # Preserve the original host.
        proxy_set_header Host $http_host;

        # Preserve original client information.
        proxy_set_header X-Real-IP $http_x_real_ip;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # CRITICAL:
        # Preserve HTTPS information from Ubuntu Nginx.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # WebSocket support.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts.
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Response buffering.
        proxy_buffering on;
    }

    # --------------------------------------------------- #
    # Health check
    # --------------------------------------------------- #

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}
